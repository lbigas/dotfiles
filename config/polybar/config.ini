[colors]
bg = #191724
bg-alt = #26233a
fg = #e0def4
muted = #908caa
accent = #9ccfd8
good = #c4a7e7
warn = #f6c177
alert = #eb6f92

[bar/main]
width = 100%
height = 30
radius = 0
background = ${colors.bg}
foreground = ${colors.fg}
line-size = 2
border-size = 0
padding-left = 1
padding-right = 1
module-margin = 1
font-0 = JetBrains Mono NL:size=11;2
modules-left = i3
modules-center = xwindow
modules-right = tray network bluetooth audio brightness caffeine date
cursor-click = pointer
enable-ipc = true
wm-restack = i3
bottom = false

[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
show-urgent = true
strip-wsnumbers = false
format = <label-state>
label-focused = %name%
label-focused-background = ${colors.bg-alt}
label-focused-foreground = ${colors.fg}
label-focused-padding = 1
label-unfocused = %name%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 1
label-visible = %name%
label-visible-foreground = ${colors.fg}
label-visible-padding = 1
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.fg}
label-urgent-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:80:...%
label-foreground = ${colors.muted}

[module/network]
type = custom/script
exec = /home/lbigas/.config/i3/scripts/network-status.sh
interval = 5
click-left = /home/lbigas/.config/i3/scripts/network-menu.sh
label = %output%
format-foreground = ${colors.accent}

[module/bluetooth]
type = custom/script
exec = /home/lbigas/.config/i3/scripts/bluetooth-status.sh
interval = 5
click-left = /home/lbigas/.config/i3/scripts/bluetooth-menu.sh
label = %output%
format-foreground = ${colors.good}

[module/audio]
type = custom/script
exec = /home/lbigas/.config/i3/scripts/audio-status.sh
interval = 2
click-left = /home/lbigas/.config/i3/scripts/audio-menu.sh
label = %output%
format-foreground = ${colors.warn}

[module/brightness]
type = custom/script
exec = /home/lbigas/.config/i3/scripts/brightness-status.sh
interval = 5
click-left = /home/lbigas/.config/i3/scripts/brightness-control.sh
scroll-up = /home/lbigas/.config/i3/scripts/brightness-control.sh --up
scroll-down = /home/lbigas/.config/i3/scripts/brightness-control.sh --down
label = %output%
format-foreground = ${colors.fg}

[module/caffeine]
type = custom/script
exec = /home/lbigas/.config/i3/scripts/caffeine-status.sh
interval = 2
click-left = /home/lbigas/.config/i3/scripts/caffeine-toggle.sh
label = %output%
format-foreground = ${colors.warn}

[module/date]
type = internal/date
interval = 30
date = %a %Y-%m-%d
time = %H:%M
label = %date% %time%
label-foreground = ${colors.fg}

[module/tray]
type = internal/tray
tray-spacing = 10px
format-margin = 8px
tray-background = ${colors.bg}
