# 1 as base index
set -g base-index 1

# change prefix Ctrl-b to Ctrl-a
unbind-key C-b
set-option -g prefix C-a

# no delay with vim
set-option -sg escape-time 0

# reload tmux config
bind-key r source-file ~/.tmux.conf \; display-message "Configuration reloaded"


# enable 256 color terminal
set-option -g default-terminal "screen-256color"

#Mouse suport - off to deactivate, on to activate
#setw -g mode-mouse off
#setw -g mouse-select-pane off
#setw -g mouse-resize-pane off
#setw -g mouse-select-window off

# select panes
bind-key k select-pane -U
bind-key h select-pane -L
bind-key j select-pane -D
bind-key l select-pane -R

# recize panes
bind-key -r J resize-pane -D 1
bind-key -r K resize-pane -U 1
bind-key -r H resize-pane -L 1
bind-key -r L resize-pane -R 1

# kill window/pane
bind-key & kill-window
bind-key x kill-pane

# pane split
bind-key v split-window -h -c "#{pane_current_path}" # vertical split
bind-key e split-window -v -c "#{pane_current_path}" # horizontal split

# --- colors (solarized dark)
# default statusbar colors
set -g status-bg black
set -g status-fg yellow
set -g status-attr default

# default window title colors
setw -g window-status-fg brightblue
setw -g window-status-bg default

# active window title colors
setw -g window-status-current-fg default
setw -g window-status-current-bg yellow
setw -g window-status-current-attr dim

# pane border
set -g pane-border-fg black
set -g pane-border-bg default
set -g pane-active-border-fg yellow
set -g pane-active-border-bg default

# command line/message text
set -g message-bg black
set -g message-fg yellow

# pane number display
set -g display-panes-active-colour yellow
set -g display-panes-colour brightblue

# clock
setw -g clock-mode-colour yellow
# --- end colors

# set -g status-right 'Batt: #{battery_icon} #{battery_percentage} #{battery_remain} | %a %h-%d %H:%M '


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-battery'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
