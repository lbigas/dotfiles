[ssid]
# command=echo "$(sudo iw dev wlp3s0 link | grep SSID | cut -d " " -f 2-)"
# command=echo "$(sudo iw dev wlan0 link | grep SSID | cut -d " " -f 2-)"
command=echo "$(iw dev wlp3s0 link | grep SSID | cut -d " " -f 2-)"
interval=5


[volume]
command=/usr/share/i3blocks/volume "5%" pulse
label=V:
instance=Master
interval=once
signal=11

[brightness]
label=B:
command=printf "%.0f" $(light -G)
# color=#a3a3a3
interval=once
signal=12

