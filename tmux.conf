set-option -g default-terminal "screen-256color"
set -s escape-time 0

unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# catppuccin (mocha) - https://github.com/catppuccin/tmux
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left "#[fg=#11111b,bg=#cba6f7,bold] #S #[fg=#cba6f7,bg=#1e1e2e,nobold] "
set -g status-right "#[fg=#cdd6f4,bg=#313244] %Y-%m-%d %H:%M #(#{HOME}/.tmux/scripts/battery-status)"
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#cdd6f4,bg=#313244] #I #W "
setw -g window-status-current-format "#[fg=#11111b,bg=#cba6f7,bold] #I #W "
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#45475a,fg=#cdd6f4"

bind r source-file ~/.tmux.conf
set -g base-index 1

set-window-option -g mode-keys vi
# bind -T copy-mode-vi v send-keys -X begin-selection
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{HOME}/.tmux/scripts/clipboard-copy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 

# vim-like pane switching
# bind -r ^ last-window
# bind -r k select-pane -U
# bind -r j select-pane -D
# bind -r h select-pane -L
# bind -r l select-pane -R

bind-key -T prefix       k                select-pane -U
bind-key -T prefix       j                select-pane -D
bind-key -T prefix       h                select-pane -L
bind-key -T prefix       l                select-pane -R

bind-key -T prefix       Up                select-pane -U
bind-key -T prefix       Down              select-pane -D
bind-key -T prefix       Left              select-pane -L
bind-key -T prefix       Right             select-pane -R

# recize panes
bind-key -r J resize-pane -D 1
bind-key -r K resize-pane -U 1
bind-key -r H resize-pane -L 1
bind-key -r L resize-pane -R 1

# kill window/pane
bind-key & kill-window
bind-key x kill-pane

# pane split
bind-key "\\" split-window -h -c "#{pane_current_path}" # vertical split
bind-key '-' split-window -v -c "#{pane_current_path}" # horizontal split

# bind T command-prompt -p "Swap current window with?:" "swap-window -t '%1'"
bind-key S command-prompt -p "Swap current pane with?:" "swap-pane -t '%1'"
# bind-key          S choose-window "join-pane -v -s "%%""
bind-key          V choose-window "join-pane -h -s "%%""

# reload tmux config
bind-key r source-file ~/.tmux.conf \; display-message "Configuration reloaded"


set -g mouse on

