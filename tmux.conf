# Gruvbox Dark (hard)
set -g status-style "bg=#1d2021,fg=#ebdbb2"
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#[fg=#1d2021,bg=#b8bb26,bold] #S #[default] "
set -g status-right "#[fg=#ebdbb2,bg=#3c3836] %Y-%m-%d %H:%M #(#{HOME}/.tmux/scripts/battery-status)"

setw -g window-status-separator ""
setw -g window-status-format " #I #W "
setw -g window-status-current-format " #I #W "
setw -g window-status-style "fg=#ebdbb2,bg=#3c3836"
setw -g window-status-current-style "fg=#1d2021,bg=#fabd2f,bold"
setw -g window-status-activity-style "fg=#8ec07c,underscore"
setw -g window-status-bell-style "fg=#1d2021,bg=#fb4934,bold"

